<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body
        {
                background-color:rgba(7, 7, 7, 0.795);

        }
        .Shetima
        {
            margin: 100px;
            padding: 50px;
            text-align: center;
            border: 1px solid white;
            animation-name: myAnimation;
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }
        .duo
            {
                margin-top: 30px;
                display: grid;
                grid-row: 2;
                grid-row-start: 1;
                grid-row-end: 2;
                column-wrap: nowrap;
            } 

        h1
        {
                color: #767676;
                font-style: italic;
                font-weight: 150;
                margin-top: 10%;
                font-weight: bolder;
        }

        p
        {
            color:rgba(240, 238, 238, 0.801);
            font-size:1em;
            font-weight: 600;
            text-justify:newspaper;
        }

        @media (min-width: 600px)
        {
            body
            {
            margin: 100px;
            padding: 50px;
            text-align: center;

            }


        }
        @keyframes myAnimation {
        from {background-color:aliceblue;}
        to {background-color:chocolate;}
        }
    </style>
    <title>Shitima</title>
</head>
<body>
    <div class="Shetima">
        <h1>Kos Om El Sisi</h1>
    <p>A7a El Mokhabrat El 7arbya, 3ala om El Toto.<br/>
        Ashraf Dah Wa7id Ahtam, We El Bedaan Samitoh 7atata
    </p>
        <div class="duo">
        <di id="Thanks">

            <p>
                Hello Everyone!
            </p>
             <p>
                Who is K ?!
            </p>

        </div>
        </div>
    </div>
</body>
</html>
